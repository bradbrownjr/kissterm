# BPQ32 / LinBPQ node command reference.
#
# provenance: the standard node command set is from G8BPQ's LinBPQ/BPQ32
# documentation and long-standing on-air convention. The prompt and banner
# shapes are confirmed against a real deployed node configuration (WS1EC-15,
# NODEALIAS CCEMA) in the sibling bpq-apps repository.
#
# [2026-09-10] The commands marked confidence = "verified" below were
# confirmed for real: a live session against WS1EC-15/CCEMA sent "?" and
# received "CCEMA:WS1EC-15} BBS CHAT AI ANTENNA BANDS CALENDAR CALLOUT DICT
# DX FORMS FORTUNE GOPHER GYX NEWS PREDICT REPEATER QRZ RMS SPACE SYSINFO
# TEST WALL WIKI WX WWW APPS CONNECT BYE INFO NODES PORTS ROUTES USERS
# MHEARD" -- every shipped core-node command below appears in it under its
# long form. The names NOT in that list (AI, ANTENNA, BANDS, CALENDAR,
# CALLOUT, DICT, DX, FORMS, FORTUNE, GOPHER, GYX, NEWS, PREDICT, REPEATER,
# QRZ, RMS, SPACE, SYSINFO, TEST, WALL, WIKI, WX, WWW, APPS) are this one
# node's own local `APPLICATION` additions, not stock BPQ32 -- exactly the
# WS1EC-15 example this package's own docstring already names as what
# harvesting (not this shipped file) is for, so they are deliberately not
# added here. STATS/PING/CQ/T were not in that node's "?" output either,
# but a single node's configuration proves nothing about their absence
# elsewhere, so they stay at "recalled" rather than being downgraded.
#
# [2026-09-10, cross-check] The same 8 core commands (CONNECT, BYE, INFO,
# NODES, PORTS, ROUTES, USERS, MHEARD) were independently confirmed, in
# their long form, by 12 of 15 real captured "?" replies in the sibling
# bpq-apps repo's own node-map crawl (utilities/nodemap.json,
# nodemap_version 1.9.1, 2026-08-25) -- a single-node harvest is now a
# 13-node one. The other 3 real nodes in that crawl (W1KRP-1, WD1F-1,
# W1ZE-1) returned single-letter-with-parenthetical-long-form command sets
# ("B(ye)", "J(heard)", "[AEA PK-232M]") that do not match this family's
# `detect_prompt`/`detect_banner` at all -- they read as a PBBS-style
# mailbox and an AEA PK-232 TNC mailbox respectively, not BPQ32, despite
# being tagged "type": "BPQ" by that crawl's own heuristic. See
# docs/ROADMAP.md P8's "more families" item: worth a real family of their
# own eventually, but 2-3 samples from one crawl is not enough to ship one
# confidently yet (AGENTS.md: "a wrong family shown confidently is worse
# than 'unknown node'"). RMS is added below as `confidence = "documented"`
# (same treatment as BBS/CHAT) on the strength of that crawl too: 9 of the
# 15 real nodes (60%) list it as a configured application, which is common
# enough across independently-run nodes to be worth naming, unlike the
# clearly node-specific additions (CALENDAR, GYX, EOC, ...) left out above.
#
# Anything marked confidence = "recalled" has NOT been checked against current
# documentation or a live node. Correct it from a real session rather than
# from memory -- see docs/ROADMAP.md P8.

[family]
id = "bpq32"
name = "BPQ32 / LinBPQ node"
confidence = "documented"
note = """
Most common node software on VHF packet. Applications (BBS, CHAT, and any
local additions) are configured per node, so the command list here covers the
node itself -- use "Learn from node" once per node to pick up its own menu.
"""

# The node prompt is CALL:ALIAS} or "de CALL>", both seen on real systems.
detect_prompt = ['^[A-Z0-9]{1,6}(-\d{1,2})?:[A-Z0-9]{1,6}\}\s*$', '^de [A-Z0-9]{1,6}(-\d{1,2})?>\s*$']
detect_banner = ['BPQ', 'LinBPQ']

[[commands]]
name = "?"
aliases = ["H", "HELP"]
summary = "List the commands this node accepts"
usage = "?"
detail = "Cheap on a node, expensive on a verbose BBS -- see the airtime note in the reference pane."
confidence = "verified"

[[commands]]
name = "B"
aliases = ["BYE"]
summary = "Disconnect from the node"
usage = "B"
confidence = "verified"

[[commands]]
name = "C"
aliases = ["CONNECT"]
summary = "Connect onward to another station or node"
usage = "C <call>  |  C <port> <call>"
detail = "With a port number, connects out on that radio port rather than via the node's routing."
confidence = "verified"

[[commands]]
name = "I"
aliases = ["INFO"]
summary = "Show the node's information text"
usage = "I"
confidence = "verified"

[[commands]]
name = "N"
aliases = ["NODES"]
summary = "List known NET/ROM nodes"
usage = "N  |  N <call>"
detail = "The bare form can be a long list on a busy network -- several thousand bytes, which is minutes of airtime at 1200 baud. Prefer N <call>."
confidence = "verified"

[[commands]]
name = "P"
aliases = ["PORTS"]
summary = "List the node's radio ports"
usage = "P"
confidence = "verified"

[[commands]]
name = "R"
aliases = ["ROUTES"]
summary = "List neighbour nodes and route quality"
usage = "R"
confidence = "verified"

[[commands]]
name = "U"
aliases = ["USERS"]
summary = "Show who is connected to the node right now"
usage = "U"
confidence = "verified"

[[commands]]
name = "MH"
aliases = ["MHEARD"]
summary = "Stations the node has heard, most recent first"
usage = "MH  |  MH <port>"
confidence = "verified"

[[commands]]
name = "STATS"
summary = "Node traffic and link statistics"
usage = "STATS"
confidence = "recalled"

[[commands]]
name = "PING"
summary = "Test reachability of another node"
usage = "PING <call>"
confidence = "recalled"

[[commands]]
name = "CQ"
summary = "Call CQ to other users connected to the node"
usage = "CQ <text>"
confidence = "recalled"

[[commands]]
name = "T"
aliases = ["TALK"]
summary = "Talk to another user connected to this node"
usage = "T <call>"
confidence = "recalled"

[[commands]]
name = "BBS"
summary = "Enter the node's bulletin board, if it has one"
usage = "BBS"
detail = "Application name, not a node command -- present only if the sysop configured it."

[[commands]]
name = "CHAT"
summary = "Enter the node's chat server, if it has one"
usage = "CHAT"
detail = "Application name, not a node command -- present only if the sysop configured it."

[[commands]]
name = "RMS"
summary = "Enter the node's Winlink RMS gateway, if it has one"
usage = "RMS"
detail = "Application name, not a node command -- present only if the sysop configured it."
confidence = "documented"
