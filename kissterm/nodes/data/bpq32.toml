# BPQ32 / LinBPQ node command reference.
#
# SOURCES, strongest first:
#   verified   -- present in a real node's own "?" reply. WS1EC-15 (alias
#                 CCEMA), 2026-09-10, answered "?" with:
#                 "CCEMA:WS1EC-15} BBS CHAT AI ANTENNA BANDS CALENDAR ... RMS
#                 ... APPS CONNECT BYE INFO NODES PORTS ROUTES USERS MHEARD".
#                 The same eight core commands were independently confirmed
#                 in 12 of 15 real "?" replies in the sibling bpq-apps repo's
#                 node-map crawl (utilities/nodemap.json, 2026-08-25).
#   documented -- G8BPQ's "G8BPQ NODE COMMANDS" page (updated July 2023):
#                 https://www.cantab.net/users/john.wiseman/Documents/NodeCommands.html
#                 and the older node commands page, for abbreviation rules:
#                 https://www.cantab.net/users/john.wiseman/Documents/Commands.htm
#   recalled   -- NOT found in either document or any capture. Shown flagged.
#
# ABBREVIATIONS: the older page says "all other commands can be abbreviated to
# the first character of the command" and application names "must be entered
# in full". The newer page capitalises the part of each command that must be
# typed ("PAClen", "LISten", "IDLEtime"); `abbrev` below records that
# capitalised prefix. It is typography, not a sentence in the document, so
# treat the longer abbreviations as documented-by-layout.
#
# CORRECTIONS made against the documentation on 2026-09-23 (previously
# "recalled"): PING is an IP ping on nodes running the IP gateway, not a
# node reachability test (that is NRR); CQ works only in LISTEN mode; HELP
# shows a sysop-written help file and is a separate command from "?".
#
# Local APPLICATION additions (WS1EC-15's CALENDAR, WALL, GOPHER, ...) are one
# sysop's menu, not stock BPQ32, and belong to harvesting, not this file.
# BBS, CHAT and RMS are named because they are common across independently
# run nodes (RMS on 9 of the 15 crawled nodes).

[family]
id = "bpq32"
name = "BPQ32 / LinBPQ node"
kind = "node"
confidence = "documented"
source = "https://www.cantab.net/users/john.wiseman/Documents/NodeCommands.html"
harvest_context = "node"
note = """
Most common node software on VHF packet. Applications (BBS, CHAT, and any
local additions) are configured per node and must be typed in full. Other
commands accept the abbreviation shown.
"""

# The node answers every command with its ALIAS:CALL} prefix -- "CCEMA:WS1EC-15}"
# on the real node above, "NOTTS:G8BPQ-3}" in the documentation. "de CALL>" is
# a sysop's own CTEXT on WS1EC-15, kept because it is how that node is first
# recognised before any command is typed.
detect_prompt = ['^[A-Z0-9#_]{1,6}:[A-Z0-9]{1,6}(-\d{1,2})?\}', '^de [A-Z0-9]{1,6}(-\d{1,2})?>\s*$']
detect_banner = ['LinBPQ']
# "CCEMA:WS1EC-15} Connected to BBS" (WS1EC-15, 2026-09-10): the node hands
# the session to an application and says which. The name is matched against
# each application family's `entered_by`.
enter_pattern = '^[A-Z0-9#_]{1,6}:[A-Z0-9]{1,6}(?:-\d{1,2})?\} Connected to ([A-Z0-9]+)\s*$'
# Coming back from an application ("Returned to Node" in Commands.htm).
return_pattern = 'Returned to Node'

[[commands]]
name = "?"
summary = "List the node's commands, including its applications"
usage = "?"
detail = "Short on a node. On a verbose BBS the same key can cost a minute of airtime."
confidence = "verified"

[[commands]]
name = "HELP"
abbrev = "H"
summary = "Show the sysop's help file, if the node has one"
usage = "HELP"
detail = "Displays NodeHelp.txt when the sysop provided one. \"?\" is the command list."

[[commands]]
name = "B"
aliases = ["BYE"]
abbrev = "B"
summary = "Disconnect from the node"
usage = "B"
confidence = "verified"

[[commands]]
name = "QUIT"
abbrev = "Q"
summary = "Disconnect from the node (same as BYE)"
usage = "QUIT"

[[commands]]
name = "C"
aliases = ["CONNECT"]
abbrev = "C"
summary = "Connect onward to a node, alias or station"
usage = "C <call|alias>  |  C <port> <call> [v <digi> ...]  |  C <port> !<call>  |  ... S"
detail = """
A call in the NODES list needs no port; any other station needs the port number \
first, optionally with digipeaters after v. ! before the call forces a level-2 \
connect. S at the end (STAY) returns you to this node when the far end \
disconnects, instead of dropping you.\
"""
confidence = "verified"

[[commands]]
name = "I"
aliases = ["INFO"]
abbrev = "I"
summary = "Show the node's information text"
usage = "I"
confidence = "verified"

[[commands]]
name = "N"
aliases = ["NODES"]
abbrev = "N"
summary = "List known NET/ROM nodes, or one node's routes"
usage = "N  |  N C  |  N <filter*>  |  N <call|alias>  |  N T  |  N VIA <call>  |  N >nnn"
detail = """
Bare N can be thousands of bytes on a busy network -- minutes at 1200 baud. \
Prefer N <call>, a wildcard filter (N GB7*), or N >nnn for quality nnn and above.\
"""
confidence = "verified"

[[commands]]
name = "P"
aliases = ["PORTS"]
abbrev = "P"
summary = "List the node's radio ports"
usage = "P"
confidence = "verified"

[[commands]]
name = "R"
aliases = ["ROUTES"]
abbrev = "R"
summary = "List neighbour nodes and route quality"
usage = "R"
confidence = "verified"

[[commands]]
name = "U"
aliases = ["USERS"]
abbrev = "U"
summary = "Show who is connected to the node right now"
usage = "U"
confidence = "verified"

[[commands]]
name = "MH"
aliases = ["MHEARD", "MHV", "MHU", "MHL"]
abbrev = "M"
summary = "Stations the node has heard on a port"
usage = "MH <port> [call-prefix]"
detail = "MHV is a verbose layout; MHU and MHL show clock time (UTC or local) instead of time since heard."
confidence = "verified"

[[commands]]
name = "APRS"
summary = "APRS stations the node has heard, or its APRS messages"
usage = "APRS  |  APRS <port>  |  APRS <call-prefix>  |  APRS MSGS  |  APRS SENT"
detail = "MSGS shows received APRS messages, SENT the node's sent ones. SEND, ENABLEIGATE, DISABLEIGATE and RECONFIG need sysop status."

[[commands]]
name = "ATTACH"
abbrev = "A"
summary = "Take a single-user port (WINMOR, Pactor) before connecting on it"
usage = "ATTACH <port>"

[[commands]]
name = "LINKS"
abbrev = "L"
summary = "List active AX.25 sessions, users and node links"
usage = "LINKS"

[[commands]]
name = "STATS"
abbrev = "S"
summary = "Node and port counters"
usage = "S  |  S <port>  |  S S"
detail = "S alone shows system counters and the first seven ports; S <port> starts from that port; S S shows only system counters."

[[commands]]
name = "VERSION"
abbrev = "V"
summary = "The node software's version"
usage = "VERSION"

[[commands]]
name = "NRR"
summary = "Trace the route to a NET/ROM node and back"
usage = "NRR <call>"
detail = "Sends a NET/ROM Record Route message; the reply shows the path taken, if the target supports NRR."

[[commands]]
name = "LISTEN"
abbrev = "LIS"
summary = "Watch traffic on a port and take calls there"
usage = "LISTEN <port(s)>  |  LISTEN OFF"
detail = """
While listening on one port, callers reach you at your call with the SSID \
inverted NET/ROM style (-15 if you connected as SSID 0), and CQ can announce \
you. You cannot connect elsewhere while listening.\
"""

[[commands]]
name = "CQ"
summary = "Send a CQ beacon while in LISTEN mode on one port"
usage = "CQ <text>"

[[commands]]
name = "UNPROTO"
abbrev = "UN"
summary = "Type unconnected UI frames onto a port"
usage = "UNPROTO <port> <call> [digis]"
detail = "Everything you type is sent by the node as a UI frame until you send Ctrl+Z."

[[commands]]
name = "PACLEN"
abbrev = "PAC"
summary = "Set the packet length for this session"
usage = "PACLEN <bytes>"

[[commands]]
name = "IDLETIME"
abbrev = "IDLE"
summary = "Set this session's idle timeout"
usage = "IDLETIME <value>"

[[commands]]
name = "L4T1"
abbrev = "L4"
summary = "Set the NET/ROM (level 4) retry timer for this session"
usage = "L4T1 <value>"

[[commands]]
name = "RADIO"
abbrev = "RAD"
summary = "Rig control, where the sysop has set it up"
usage = "RADIO ..."

[[commands]]
name = "PASSWORD"
summary = "Enter sysop mode"
usage = "PASSWORD"
sysop = true

[[commands]]
name = "PING"
abbrev = "PI"
summary = "ICMP ping an IP address (nodes running the IP gateway)"
usage = "PING <a.b.c.d>"
detail = "An IP ping, not a node reachability test -- use NRR for that."

[[commands]]
name = "AGWSTATUS"
abbrev = "AGW"
summary = "Status of the node's AGWPE emulator"
usage = "AGWSTATUS"

[[commands]]
name = "ARP"
summary = "The IP ARP table (IP gateway nodes)"
usage = "ARP"

[[commands]]
name = "AXRESOLVER"
abbrev = "AXR"
summary = "The AXIP resolver table for a port"
usage = "AXRESOLVER <port>"

[[commands]]
name = "AXMHEARD"
abbrev = "AXM"
summary = "The AXIP heard list for a port"
usage = "AXMHEARD <port>"

[[commands]]
name = "IPROUTE"
abbrev = "IPR"
summary = "The IP routing table (IP gateway nodes)"
usage = "IPROUTE [filter]"

[[commands]]
name = "NAT"
summary = "The IP NAT table (IP gateway nodes)"
usage = "NAT"

[[commands]]
name = "TELSTATUS"
abbrev = "TEL"
summary = "Telnet server connection status for a port"
usage = "TELSTATUS <port>"

[[commands]]
name = "UZ7HO"
summary = "Send a command to the UZ7HO soundmodem driver"
usage = "UZ7HO <port> FREQ [hz]  |  UZ7HO <port> MODEM [name|number]"

[[commands]]
name = "T"
aliases = ["TALK"]
summary = "Talk to another user connected to this node"
usage = "T <call>"
detail = "Not in G8BPQ's node command pages or any capture; may not exist on current BPQ32."
confidence = "recalled"

[[commands]]
name = "BBS"
summary = "Enter the node's bulletin board, if it has one"
usage = "BBS"
detail = "An application, configured by the sysop; must be typed in full."
confidence = "verified"
application = true

[[commands]]
name = "CHAT"
summary = "Enter the node's chat server, if it has one"
usage = "CHAT  |  CHAT <topic>"
detail = "An application, configured by the sysop; must be typed in full. A topic name joins that topic directly."
confidence = "verified"
application = true

[[commands]]
name = "RMS"
summary = "Enter the node's Winlink RMS gateway, if it has one"
usage = "RMS"
detail = "An application, configured by the sysop; must be typed in full."
confidence = "verified"
application = true
