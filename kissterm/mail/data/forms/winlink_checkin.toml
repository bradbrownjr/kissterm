# Winlink Check-in, the form Winlink Wednesday and many ARES Winlink nets
# ask for. Body, subject, field names, choices and limits: Winlink
# Standard Forms 1.1.20.0, "General Forms/Winlink Check-in.txt" and
# Winlink_Check_In_Initial.html (template "Winlink Check-in 5.1.3"); the
# subject is the form's Getsubject(): "Winlink Check-in <type> - <call> -
# <location>". Differences: the template's tab after each label is one
# space here (kissterm sends tabs as spaces anyway); the location-source,
# map-file and "[No changes...]" lines are Winlink Express's own and are
# left out. Band and session default to VHF packet, kissterm's usual path,
# instead of the template's NA/Telnet.
id = "winlink_checkin"
title = "Winlink Check-in"
source = "Winlink Standard Forms 1.1.20.0 (Winlink Check-in 5.1.3)"
subject = "Winlink Check-in <var Status> - <var MsgSender> - <var Location>"
subject_var = "Newsubject"
to_field = "MsgTo"
body = '''
Winlink Check-in
0. HEADER
  0a: Organization: <var Organization>
  0b: Subject: <var Newsubject>
  0c: Event/Exercise ID: <var exercise_id>

1. STATION
  1a. Date/Time: <var DateTime>
  1b. To: <var MsgTo>
  1c. From: <var MsgSender>
  1d. Station Contact Name: <var ContactName>
  1e. Initial Operators: <var Assigned>

2. SESSION
  2a. Type: <var Status>
  2b. Service: <var Service>
  2c. Band: <var Band>
  2d. Session: <var Session>

3. LOCATION
  3a. Location: <var Location>
  3b. Latitude: <var mapLat>
  3c. Longitude: <var mapLon>
  3d. MGRS: <var MGRS>
  3e. Grid Square: <var Grid>
-------------------------------------------------------------
4a COMMENTS:

<var Comments>

-------------------------------------------------------------

Winlink Check-in 5.1.3
'''

[[fields]]
id = "MsgTo"
label = "1b. To"
required = true
max_length = 75
remember = true
placeholder = "net control's address"
help = "Where the net asks check-ins to go; several addresses separated by ;. Remembered."

[[fields]]
id = "Organization"
label = "0a. Organization"
default = "Winlink Net"
remember = true
help = "The net or group, as the template's Setup button sets it. Remembered."

[[fields]]
id = "exercise_id"
label = "0c. Exercise ID"
max_length = 25
placeholder = "if known, e.g. SHAKEOUT"

[[fields]]
id = "DateTime"
label = "1a. Date/time"
kind = "datetime"
format = "%Y-%m-%d %H:%M:%S"
required = true
max_length = 19

[[fields]]
id = "MsgSender"
label = "1c. From"
auto = "mycall"
required = true
max_length = 12

[[fields]]
id = "ContactName"
label = "1d. Contact name"
max_length = 25
remember = true
help = "Name of the station contact. Remembered."

[[fields]]
id = "Assigned"
label = "1e. Operators"
max_length = 40
remember = true
placeholder = "initial operator(s)"

[[fields]]
id = "Status"
label = "2a. Type"
kind = "choice"
choices = ["EXERCISE", "REAL EVENT"]
default = "EXERCISE"

[[fields]]
id = "Service"
label = "2b. Service"
kind = "choice"
choices = ["AMATEUR", "SHARES"]
default = "AMATEUR"

[[fields]]
id = "Band"
label = "2c. Band"
kind = "choice"
choices = ["NA", "Telnet", "HF", "VHF", "UHF", "SHF"]
default = "VHF"
remember = true

[[fields]]
id = "Session"
label = "2d. Session"
kind = "choice"
choices = ["Telnet", "Packet", "Pactor", "Robust Packet", "Ardop", "VARA HF", "VARA FM", "Iridium Go", "Mesh"]
default = "Packet"
remember = true

[[fields]]
id = "Location"
label = "3a. Location"
required = true
max_length = 60
remember = true
placeholder = "e.g. Hope Hospital, parking lot C near ER entrance"

[[fields]]
id = "mapLat"
label = "3b. Latitude"
placeholder = "optional, e.g. 38.5567"

[[fields]]
id = "mapLon"
label = "3c. Longitude"
placeholder = "optional, e.g. -121.7932"

[[fields]]
id = "MGRS"
label = "3d. MGRS"
max_length = 15
placeholder = "optional"

[[fields]]
id = "Grid"
label = "3e. Grid square"
auto = "grid"
max_length = 8
help = "Filled from Settings > APRS when your position is set."

[[fields]]
id = "Comments"
label = "4a. Comments"
kind = "multiline"
max_length = 500
help = "e.g. On batteries. Need relief in 6 hours. A brief sitrep."
