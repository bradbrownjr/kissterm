[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kissterm"
version = "0.1.97"
description = "A modern terminal UI for amateur radio packet -- AX.25 connected mode over KISS, with no Linux kernel AX.25 stack required"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Brad Brown Jr", email = "bradbrownjr@gmail.com"}]
keywords = ["amateur radio", "ham radio", "packet radio", "ax25", "kiss", "aprs", "bpq32", "textual", "tnc"]
dependencies = ["textual", "rich", "pyserial", "platformdirs"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Ham Radio",
]

[project.urls]
Homepage = "https://github.com/bradbrownjr/kissterm"
Repository = "https://github.com/bradbrownjr/kissterm"
Issues = "https://github.com/bradbrownjr/kissterm/issues"
Changelog = "https://github.com/bradbrownjr/kissterm/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
# Faster asyncio serial I/O. Without this, serial_kiss.py falls back to a
# blocking pyserial read pumped from a thread -- it works everywhere, this
# is just less overhead. See kissterm/transport/serial_kiss.py.
serial = ["pyserial-asyncio-fast"]
# Bluetooth Low Energy TNCs (Mobilinkd TNC4's BLE/GATT mode). Classic
# Bluetooth RFCOMM TNCs need no extra dependency -- they show up as a plain
# serial device (/dev/rfcomm0) once paired, and use the base "serial" path.
ble = ["bleak"]
# Telnet needs nothing extra (plain asyncio TCP, see transport/telnet.py).
# SSH does -- an asyncio-native client library, unlike the thread-based
# paramiko, which would need the same executor bridge serial_kiss.py uses
# for pyserial. See transport/ssh.py.
ssh = ["asyncssh"]
# aprslib (GPLv2) is test-only, never imported at runtime -- kissterm is MIT
# and a runtime dependency on GPL code would put a copyleft obligation on
# anyone distributing kissterm (relevant for the PyPI/Debian packaging
# roadmap items). It exists purely as an independent cross-check for
# kissterm/aprs/mice.py: found and fixed a real bug in 0.1.44 (an inverted
# message-status table) that this codebase's own self-consistent fixtures
# could never have caught. See tests/unit/test_aprs_mice_cross_check.py.
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "asyncssh", "aprslib"]
all = ["pyserial-asyncio-fast", "bleak", "asyncssh"]

[project.scripts]
kissterm = "kissterm.__main__:main"

[tool.setuptools.package-data]
# The shipped command references are data, not code. Without this they are
# absent from an installed wheel and the help pane is silently empty -- the
# kind of bug that never shows up in a source checkout.
"kissterm.nodes" = ["data/*.toml"]
# Same trap, same fix, for the APRS gateway service directory. Without this
# the Templates picker in the APRS pane is silently empty in an installed
# wheel while working perfectly in a source checkout.
"kissterm.aprs_services" = ["data/*.toml"]

[tool.setuptools.packages.find]
include = ["kissterm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto: parallelize across CPU cores (pytest-xdist). ~5x faster on the
# full suite (14m -> 3m measured on a 12-core machine) with zero change in
# what runs -- kissterm._isolate.isolate() already gives each test file its
# own tempfile.mkdtemp() config directory, and xdist workers are separate
# processes, so there is no shared-state collision to worry about. Drop to
# plain `pytest -p no:cacheprovider -n0` (or just `-n0`) if you ever need to
# debug a single test's output without interleaving.
addopts = "-n auto"
